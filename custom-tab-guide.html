<!--
  Jellyfin "Custom Tabs" plugin content (IAmParadox27/jellyfin-plugin-custom-tabs).

  This points the tab at Matcher's built-in /guide page via an iframe, which is
  the plugin's own tested pattern. The guide (apps for TV/phone/laptop, how to
  request in Jellyseerr, how to use Matcher) lives in the Matcher app, so it
  stays in one place and you never edit HTML here.

  How to use:
  1. Admin Dashboard -> My Plugins -> Custom Tabs -> add a tab.
  2. Set Display Text to something like "Help" or "Guide".
  3. Paste everything below this comment into the "Html Content" box.
  4. Replace MATCHER_URL with your Matcher address (for example
     https://match.yourdomain.com). Keep the /guide on the end.
  5. Save, then force-refresh the web client.

  The height offsets below match the plugin's own example; nudge them if your
  Jellyfin header is a different size.
-->
<style>
  .matcherGuide {
    width: 100%;
    height: calc(100vh - 50.716px);
    position: absolute;
    border: 0;
    margin-top: -20.716px;
  }
  @media only screen and (max-width: 990px) {
    .matcherGuide {
      height: calc(100vh - 105.15px) !important;
      margin-top: -6.15px !important;
    }
  }
</style>
<div class="sections">
  <iframe class="matcherGuide" src="MATCHER_URL/guide"></iframe>
</div>
