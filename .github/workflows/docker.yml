name: publish image

on:
  push:
    branches: [main]
    # A release tag publishes a pinnable version. Without one the only thing a
    # compose file can name is `:latest`, which is not a version and cannot be
    # rolled back to.
    tags: ['v*.*.*']
  # Contributors need to see a green check without asking. The gate job runs on
  # every pull request; publishing stays limited to main.
  pull_request:
    branches: [main]
  # Rot arrives from outside. A household installs this and leaves it alone, so
  # the thing that breaks it is a dependency, a Node release or an Actions
  # deprecation -- none of which involves anybody pushing. Without a scheduled
  # run the first person to find out is somebody on a Friday night with guests
  # in the room. The docker job below is gated on `push`, so this only runs the
  # gate and publishes nothing. (Gate U11, docs/UPSTREAM.md.)
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  # Nothing ships past a red gate.
  #
  # This ran --fast on the reasoning that the docker job builds the app anyway.
  # But --fast skips G7, which inspects the built stylesheet -- and G7 exists
  # because Lightning CSS silently dropped `backdrop-filter` from every frosted
  # pane in the app, shipping the whole redesign flat on Chrome (R82). The
  # docker job does build, but into an image nothing reads the CSS out of, so
  # that build proved nothing. A gate that skips the check for the worst bug
  # this repo has shipped is decorative on the axis that matters most.
  #
  # The cost is one `next build` per run. That is the correct price.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run gate

  docker:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only; arm64 under QEMU tripled build times. Add
          # linux/arm64 back here if you run on a Pi.
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push happens before this job runs, so the repository is never behind
      # what is deployed. Anything reading the repo describes live code.
      # This repo's package is already public -- verified by an anonymous
      # manifest pull returning 200 -- so this is a no-op here. It exists
      # because the package GITHUB_TOKEN creates is private by DEFAULT, which
      # is what a fork gets, and a private package fails every
      # `docker compose pull` with `denied`.
      - name: Ensure the package is public (no-op when it already is)
        continue-on-error: true
        run: |
          gh api -X PATCH "user/packages/container/${PKG}/visibility"             -f visibility=public ||           echo "Could not set visibility automatically. Set it once by hand at:
            https://github.com/users/${{ github.repository_owner }}/packages/container/${PKG}/settings"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: jellyfin-matcher

      - name: Report deployed version
        run: |
          echo "deployed ${{ github.sha }}"
          echo "verify with: MATCHER_URL=http://your-host:3000 npm run prod:read"
