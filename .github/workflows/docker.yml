name: publish image

on:
  push:
    branches: [main]
  # Contributors need to see a green check without asking. The gate job runs on
  # every pull request; publishing stays limited to main.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  # Nothing ships past a red gate. The docker job builds the app anyway, so
  # this one runs --fast: types, tests, counts and pinned claims.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run gate -- --fast

  docker:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only; arm64 under QEMU tripled build times. Add
          # linux/arm64 back here if you run on a Pi.
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push happens before this job runs, so the repository is never behind
      # what is deployed. Anything reading the repo describes live code.
      - name: Report deployed version
        run: |
          echo "deployed ${{ github.sha }}"
          echo "verify with: MATCHER_URL=http://your-host:3000 npm run prod:read"
