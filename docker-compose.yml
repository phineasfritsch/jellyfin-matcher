services:
  jellyfin-matcher:
    # Pin a version rather than tracking :latest, so an upgrade is something
    # you choose and can roll back. Tags: https://github.com/phineasfritsch/jellyfin-matcher/pkgs/container/jellyfin-matcher
    image: ghcr.io/phineasfritsch/jellyfin-matcher:latest
    # build: .   # uncomment to build from source instead of pulling
    container_name: jellyfin-matcher
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - JELLYFIN_URL=http://192.168.1.100:8096
      - JELLYFIN_API_KEY=your_jellyfin_api_key
      - JELLYSEERR_URL=http://192.168.1.100:5055
      - JELLYSEERR_API_KEY=your_jellyseerr_api_key
      - MDBLIST_API_KEY=your_mdblist_api_key
    volumes:
      # Keeps the MDBList ratings cache AND the watch history across restarts.
      # Without this the app forgets what the household already watched every
      # time the container is replaced, and the same two genres start dealing
      # the same deck again.
      #
      # A NAMED volume, not a bind mount, and that is the whole point (R109).
      # This image runs as a non-root user; Docker creates an absent bind-mount
      # source root-owned and it does not inherit the image directory's
      # ownership, so `./cache:/app/.cache` gives you a container that cannot
      # write its own cache. Both writers fail open, so nothing appears broken:
      # ratings silently re-fetch on every deck build against a metered key, and
      # the watch history silently records nothing.
      #
      # If you would rather have the files visible on the host, swap the line
      # below for `- ./cache:/app/.cache` and first run:
      #     mkdir -p cache && sudo chown -R 10001:10001 cache
      - matcher-cache:/app/.cache
    # The image ships a HEALTHCHECK against /healthz; this makes `docker ps`
    # tell you whether the app can actually answer, not just that it started.
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', '--tries=1', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  matcher-cache:
