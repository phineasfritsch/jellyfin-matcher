services:
  jellyfin-matcher:
    image: ghcr.io/phineasfritsch/jellyfin-matcher:latest
    # build: .   # uncomment to build from source instead of pulling
    container_name: jellyfin-matcher
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # keeps the MDBList ratings cache across restarts
      - ./cache:/app/.cache
